---
# Global variables for all k8s nodes
# Override these in your inventory or via -e flag

# ===========================================
# Distribution Selection
# ===========================================
# Options: k3s, microk8s

# ===========================================
# K3s Configuration
# ===========================================
k3s_version: ""  # Empty = latest, or specify e.g., "v1.29.0+k3s1"
k3s_channel: "stable"  # stable, latest, or specific version

# K3s installation options
k3s_disable_components:
  - traefik        # We'll use Istio ingress gateway instead
  # - servicelb    # Uncomment if using MetalLB

k3s_flannel_backend: "none"  # Disable flannel, we use Calico

# K3s extra arguments for server
k3s_server_extra_args: >-
  --disable-network-policy
  --write-kubeconfig-mode 644

# K3s extra arguments for agent (workers)
k3s_agent_extra_args: ""

# ===========================================
# MicroK8s Configuration
# ===========================================
microk8s_version: ""  # Empty = latest, or specify channel e.g., "1.29/stable"
microk8s_channel: "stable"

# MicroK8s addons to enable
microk8s_addons:
  - dns
  - storage
  - helm3
  - rbac
  # - dashboard      # Uncomment if needed
  # - ingress        # Uncomment if not using Istio
  # - metallb        # Uncomment for bare-metal LB

# MicroK8s Calico addon (alternative to default CNI)
microk8s_use_calico: true

# ===========================================
# CNI Configuration (for k3s)
# ===========================================
# Options: calico, cilium, flannel
cni_plugin: "calico"

# Calico settings
calico_version: "v3.27.0"
calico_operator_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml"
calico_crd_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml"

# Pod CIDR (must match k3s cluster-cidr)
pod_cidr: "10.42.0.0/16"
service_cidr: "10.43.0.0/16"

# ===========================================
# Kubeconfig Settings
# ===========================================
# Where to copy kubeconfig for non-root user
kubeconfig_user: "{{ ansible_user }}"
kubeconfig_group: "{{ ansible_user }}"
kubeconfig_dir: "/home/{{ ansible_user }}/.kube"

# Also setup for root user
setup_root_kubeconfig: true

# Kernel modules required
required_kernel_modules:
  - br_netfilter
  - overlay

# Sysctl settings for Kubernetes
sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

# ===========================================
# Firewall Ports (if ufw is enabled)
# ===========================================
k8s_firewall_ports:
  - { port: 6443, proto: tcp, comment: "Kubernetes API" }
  - { port: 2379, proto: tcp, comment: "etcd client" }
  - { port: 2380, proto: tcp, comment: "etcd peer" }
  - { port: 10250, proto: tcp, comment: "Kubelet API" }
  - { port: 10251, proto: tcp, comment: "kube-scheduler" }
  - { port: 10252, proto: tcp, comment: "kube-controller-manager" }
  - { port: "30000:32767", proto: tcp, comment: "NodePort Services" }

# ===========================================
# Timeouts
# ===========================================
k8s_ready_timeout: 300  # seconds to wait for cluster to be ready
cni_ready_timeout: 120  # seconds to wait for CNI to be ready

# ===========================================
# MLOps Stack Configuration
# ===========================================
# Feature flags for selective installation
install_istio: true
install_knative: true
install_cert_manager: true
install_kserve: true

# ===========================================
# Istio Configuration
# ===========================================
istio_version: "knative-v1.20.1"
istio_namespace: "istio-system"
istio_manifest_url: "https://github.com/knative-extensions/net-istio/releases/download/{{ istio_version }}/istio.yaml"
istio_istiod_replicas: 1
istio_ingressgateway_replicas: 1
istio_disable_hpa: true
istio_ready_timeout: 300

# ===========================================
# Knative Serving Configuration
# ===========================================
knative_version: "knative-v1.20.1"
knative_serving_namespace: "knative-serving"
knative_serving_crds_url: "https://github.com/knative/serving/releases/download/{{ knative_version }}/serving-crds.yaml"
knative_serving_core_url: "https://github.com/knative/serving/releases/download/{{ knative_version }}/serving-core.yaml"
knative_net_istio_url: "https://github.com/knative/net-istio/releases/download/{{ knative_version }}/net-istio.yaml"
knative_ready_timeout: 300

# ===========================================
# Cert-Manager Configuration
# ===========================================
cert_manager_version: "v1.17.2"
cert_manager_namespace: "cert-manager"
cert_manager_manifest_url: "https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml"
cert_manager_ready_timeout: 300

# ===========================================
# KServe Configuration
# ===========================================
kserve_version: "v0.12.0"
kserve_namespace: "kserve"
kserve_manifest_url: "https://github.com/kserve/kserve/releases/download/{{ kserve_version }}/kserve.yaml"
kserve_cluster_resources_url: "https://github.com/kserve/kserve/releases/download/{{ kserve_version }}/kserve-cluster-resources.yaml"
kserve_ready_timeout: 300
install_monitoring: true

# ===========================================
# Kata Containers Configuration
# ===========================================
install_kata: true
kata_version: ""           # Empty = fetch latest from GitHub API
kata_namespace: "kube-system"
kata_default_shim: "qemu"  # qemu supports amd64, arm64, s390x, ppc64le
kata_k8s_distribution: "k3s"
