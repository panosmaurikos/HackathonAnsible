---
- name: Kubernetes Cluster Setup
  hosts: k8s_nodes
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display distribution menu
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================================"
          - ""
          - "           KUBERNETES DISTRIBUTION SELECTION"
          - ""
          - "================================================================"
          - ""
          - "  [1] k3s       - Lightweight Kubernetes (Recommended)"
          - ""
          - "  [2] microk8s  - Canonical's Kubernetes"
          - ""
          - "================================================================"
          - ""
      when: k8s_distribution is not defined
      run_once: true

    - name: Interactive distribution selection
      ansible.builtin.pause:
        prompt: "Enter your choice (1 or 2) [Default: 1]"
      register: distribution_input
      when: k8s_distribution is not defined
      run_once: true

    - name: Set k8s_distribution from user input
      ansible.builtin.set_fact:
        k8s_distribution: "{{ 'k3s' if (distribution_input.user_input | default('1') == '1' or distribution_input.user_input | default('1') == '') else 'microk8s' }}"
      when: k8s_distribution is not defined
      run_once: true

    - name: Validate distribution choice
      ansible.builtin.assert:
        that:
          - k8s_distribution in ['k3s', 'microk8s']
        fail_msg: "Invalid distribution. Choose 'k3s' or 'microk8s'"
        success_msg: "Installing {{ k8s_distribution }}"

    - name: Display installation plan
      ansible.builtin.debug:
        msg: |
          ============================================
          Kubernetes Installation Plan
          ============================================
          Distribution: {{ k8s_distribution }}
          CNI: {{ cni_plugin | default('calico') }}
          Istio: {{ install_istio | default(true) }}
          Knative: {{ install_knative | default(true) }}
          Cert-Manager: {{ install_cert_manager | default(true) }}
          KServe: {{ install_kserve | default(true) }}
          ============================================

  roles:
    - role: common
      tags: [common, always]

    - role: k3s
      when: k8s_distribution == 'k3s'
      tags: [k3s, kubernetes]

    - role: microk8s
      when: k8s_distribution == 'microk8s'
      tags: [microk8s, kubernetes]

    - role: cni
      when: k8s_distribution == 'k3s'
      tags: [cni, networking]

    # ===========================================
    # MLOps Stack
    # ===========================================
    - role: istio
      when: install_istio | default(true)
      tags: [istio, service-mesh, mlops]

    - role: knative
      when: install_knative | default(true)
      tags: [knative, serverless, mlops]

    - role: cert-manager
      when: install_cert_manager | default(true)
      tags: [cert-manager, certificates, mlops]

    - role: kserve
      when: install_kserve | default(true)
      tags: [kserve, ml-serving, mlops]

  post_tasks:
    - name: Verify cluster is ready
      ansible.builtin.command: kubectl get nodes
      register: nodes_output
      changed_when: false
      retries: 10
      delay: 10
      until: nodes_output.rc == 0

    - name: Display cluster status
      ansible.builtin.debug:
        msg: |
          ============================================
          Cluster Ready!
          ============================================
          {{ nodes_output.stdout }}
          ============================================

    - name: Display MLOps stack status
      ansible.builtin.debug:
        msg: |
          ============================================
          MLOps Stack Status
          ============================================
          Components Installed:
          {{ '✓' if install_istio | default(true) else '○' }} Istio (Service Mesh)
          {{ '✓' if install_knative | default(true) else '○' }} Knative Serving (Serverless)
          {{ '✓' if install_cert_manager | default(true) else '○' }} Cert-Manager (TLS)
          {{ '✓' if install_kserve | default(true) else '○' }} KServe (ML Model Serving)
          ============================================
      when: install_istio | default(true) or install_knative | default(true)
