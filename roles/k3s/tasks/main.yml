---
# K3s Installation Role

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Get existing k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Display existing k3s version
  ansible.builtin.debug:
    msg: "K3s already installed: {{ k3s_installed_version.stdout | default('N/A') }}"
  when: k3s_binary.stat.exists

# ===========================================
# Master Node Installation
# ===========================================
- name: Install k3s on master node
  when: node_role | default('master') == 'master'
  block:
    - name: Download and install k3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_CHANNEL={{ k3s_channel }} \
        {% if k3s_version %}INSTALL_K3S_VERSION={{ k3s_version }}{% endif %} \
        sh -s - server \
        --flannel-backend={{ k3s_flannel_backend }} \
        {% for component in k3s_disable_components %}--disable={{ component }} {% endfor %} \
        --cluster-cidr={{ pod_cidr }} \
        --service-cidr={{ service_cidr }} \
        {{ k3s_server_extra_args }}
      args:
        creates: /usr/local/bin/k3s
      register: k3s_install
      notify: Restart k3s

    - name: Wait for k3s to be ready
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_ready
      retries: 30
      delay: 10
      until: k3s_ready.rc == 0
      changed_when: false

    - name: Get k3s token for workers
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Set k3s token fact
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
        k3s_master_ip: "{{ ansible_default_ipv4.address }}"

# ===========================================
# Worker Node Installation
# ===========================================
- name: Install k3s on worker node
  when: node_role | default('master') == 'worker'
  block:
    - name: Download and install k3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_CHANNEL={{ k3s_channel }} \
        {% if k3s_version %}INSTALL_K3S_VERSION={{ k3s_version }}{% endif %} \
        K3S_URL=https://{{ k3s_master_ip }}:6443 \
        K3S_TOKEN={{ k3s_token }} \
        sh -s - agent {{ k3s_agent_extra_args }}
      args:
        creates: /usr/local/bin/k3s
      notify: Restart k3s-agent

# ===========================================
# Kubeconfig Setup
# ===========================================
- name: Setup kubeconfig for user
  when: node_role | default('master') == 'master'
  block:
    - name: Copy kubeconfig to user directory
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_dir }}/config"
        owner: "{{ kubeconfig_user }}"
        group: "{{ kubeconfig_group }}"
        mode: '0600'
        remote_src: true

    - name: Update kubeconfig server address
      ansible.builtin.replace:
        path: "{{ kubeconfig_dir }}/config"
        regexp: 'server: https://127.0.0.1:6443'
        replace: 'server: https://{{ ansible_default_ipv4.address }}:6443'

    - name: Copy kubeconfig to root
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /root/.kube/config
        owner: root
        group: root
        mode: '0600'
        remote_src: true
      when: setup_root_kubeconfig

    - name: Set KUBECONFIG in bashrc for user
      ansible.builtin.lineinfile:
        path: "/home/{{ kubeconfig_user }}/.bashrc"
        line: 'export KUBECONFIG={{ kubeconfig_dir }}/config'
        state: present
        create: true
        mode: '0644'

    - name: Set KUBECONFIG in bashrc for root
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: 'export KUBECONFIG=/root/.kube/config'
        state: present
      when: setup_root_kubeconfig

    - name: Create kubectl symlink (if not exists)
      ansible.builtin.file:
        src: /usr/local/bin/k3s
        dest: /usr/local/bin/kubectl
        state: link
      failed_when: false

    - name: Setup kubectl bash completion
      ansible.builtin.shell: |
        kubectl completion bash > /etc/bash_completion.d/kubectl
      args:
        creates: /etc/bash_completion.d/kubectl
