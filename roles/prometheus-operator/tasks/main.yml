---
# Prometheus Operator Installation Role

- name: Check if monitoring namespace exists
  ansible.builtin.command: kubectl get namespace {{ monitoring_namespace }}
  register: monitoring_namespace_check
  changed_when: false
  failed_when: false

- name: Install kube-prometheus stack
  when: node_role | default('master') == 'master' and install_monitoring | default(true)
  block:
    - name: Create monitoring namespace
      ansible.builtin.command: kubectl create namespace {{ monitoring_namespace }}
      when: monitoring_namespace_check.rc != 0
      register: create_namespace
      changed_when: "'created' in create_namespace.stdout"
      failed_when: create_namespace.rc != 0 and 'AlreadyExists' not in create_namespace.stderr

    - name: Create temporary directory for kube-prometheus manifests
      ansible.builtin.tempfile:
        state: directory
        suffix: kube-prometheus
      register: kube_prometheus_tmp

    - name: Clone kube-prometheus repository
      ansible.builtin.git:
        repo: 'https://github.com/prometheus-operator/kube-prometheus.git'
        dest: "{{ kube_prometheus_tmp.path }}"
        version: "{{ kube_prometheus_version }}"
        depth: 1

    - name: Apply kube-prometheus setup manifests (CRDs)
      ansible.builtin.shell: |
        kubectl apply --server-side -f {{ kube_prometheus_tmp.path }}/manifests/setup/
      register: setup_result
      changed_when: "'created' in setup_result.stdout or 'configured' in setup_result.stdout"
      failed_when: setup_result.rc != 0 and 'AlreadyExists' not in setup_result.stderr

    - name: Wait for Prometheus Operator CRDs to be established
      ansible.builtin.shell: |
        kubectl wait --for=condition=established crd \
          prometheuses.monitoring.coreos.com \
          servicemonitors.monitoring.coreos.com \
          podmonitors.monitoring.coreos.com \
          --timeout=60s
      register: crds_ready
      changed_when: false
      retries: 5
      delay: 10

    - name: Apply kube-prometheus main manifests
      ansible.builtin.shell: |
        kubectl apply --server-side --force-conflicts -f {{ kube_prometheus_tmp.path }}/manifests/
      register: manifests_result
      changed_when: "'created' in manifests_result.stdout or 'configured' in manifests_result.stdout"
      failed_when: manifests_result.rc != 0 and 'AlreadyExists' not in manifests_result.stderr

    - name: Wait for Prometheus Operator deployment
      ansible.builtin.command: >
        kubectl wait --for=condition=available deployment/prometheus-operator
        -n {{ monitoring_namespace }}
        --timeout=120s
      changed_when: false
      retries: 3
      delay: 10

    - name: Wait for Prometheus StatefulSet to exist
      ansible.builtin.command: kubectl get statefulset prometheus-k8s -n {{ monitoring_namespace }}
      register: prometheus_sts_exists
      retries: 30
      delay: 5
      until: prometheus_sts_exists.rc == 0
      changed_when: false

    - name: Wait for Grafana deployment to exist
      ansible.builtin.command: kubectl get deployment grafana -n {{ monitoring_namespace }}
      register: grafana_deploy_exists
      retries: 30
      delay: 5
      until: grafana_deploy_exists.rc == 0
      changed_when: false

    - name: Wait for Prometheus pods to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=ready pod
        -l app.kubernetes.io/name=prometheus
        -n {{ monitoring_namespace }}
        --timeout=180s
      changed_when: false
      retries: 3
      delay: 10
      failed_when: false

    - name: Wait for Grafana pods to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=ready pod
        -l app.kubernetes.io/name=grafana
        -n {{ monitoring_namespace }}
        --timeout=180s
      changed_when: false
      retries: 3
      delay: 10
      failed_when: false

    - name: Patch Grafana service to NodePort
      ansible.builtin.command: >
        kubectl patch svc grafana -n {{ monitoring_namespace }}
        --type='json'
        -p='[{"op": "replace", "path": "/spec/type", "value":"NodePort"},{"op": "add", "path": "/spec/ports/0/nodePort", "value":{{ grafana_nodeport }}}]'
      register: grafana_patch
      changed_when: "'patched' in grafana_patch.stdout"
      failed_when: grafana_patch.rc != 0 and 'not patched' not in grafana_patch.stdout

    - name: Patch Prometheus service to NodePort
      ansible.builtin.command: >
        kubectl patch svc prometheus-k8s -n {{ monitoring_namespace }}
        --type='json'
        -p='[{"op": "replace", "path": "/spec/type", "value":"NodePort"},{"op": "add", "path": "/spec/ports/0/nodePort", "value":{{ prometheus_nodeport }}}]'
      register: prometheus_patch
      changed_when: "'patched' in prometheus_patch.stdout"
      failed_when: prometheus_patch.rc != 0 and 'not patched' not in prometheus_patch.stdout

    - name: Enable Grafana anonymous access
      ansible.builtin.shell: |
        kubectl get secret grafana-config -n {{ monitoring_namespace }} -o json | \
        jq '.data."grafana.ini" |= (@base64d + "\n\n[auth.anonymous]\nenabled = true\norg_role = Viewer\norg_name = Main Org.\n\n[auth]\ndisable_login_form = false\n" | @base64)' | \
        kubectl apply -f -
      register: grafana_anonymous
      changed_when: "'configured' in grafana_anonymous.stdout"
      failed_when: grafana_anonymous.rc != 0

    - name: Restart Grafana to apply anonymous access
      ansible.builtin.command: kubectl delete pod -n {{ monitoring_namespace }} -l app.kubernetes.io/name=grafana
      when: grafana_anonymous.changed
      register: grafana_pod_restart
      changed_when: "'deleted' in grafana_pod_restart.stdout"

    - name: Wait for Grafana to restart
      ansible.builtin.command: >
        kubectl wait --for=condition=ready pod
        -l app.kubernetes.io/name=grafana
        -n {{ monitoring_namespace }}
        --timeout=120s
      when: grafana_anonymous.changed
      changed_when: false
      retries: 3
      delay: 10

    - name: Scale Prometheus to 1 replica (sufficient for hackathon)
      ansible.builtin.command: >
        kubectl patch prometheus k8s -n {{ monitoring_namespace }}
        --type='json'
        -p='[{"op": "replace", "path": "/spec/replicas", "value": 1}]'
      register: prometheus_scale
      changed_when: "'patched' in prometheus_scale.stdout"
      failed_when: prometheus_scale.rc != 0 and 'not patched' not in prometheus_scale.stdout

    - name: Deploy KServe PodMonitor
      ansible.builtin.command: >
        kubectl apply -f {{ role_path }}/files/kserve-podmonitor.yaml
      register: kserve_podmonitor
      changed_when: "'created' in kserve_podmonitor.stdout or 'configured' in kserve_podmonitor.stdout"
      failed_when: kserve_podmonitor.rc != 0 and 'AlreadyExists' not in kserve_podmonitor.stderr

    - name: Deploy Knative ServiceMonitors
      ansible.builtin.command: >
        kubectl apply -f {{ role_path }}/files/knative-servicemonitor.yaml
      register: knative_servicemonitor
      changed_when: "'created' in knative_servicemonitor.stdout or 'configured' in knative_servicemonitor.stdout"
      failed_when: knative_servicemonitor.rc != 0 and 'AlreadyExists' not in knative_servicemonitor.stderr

    - name: Clean up temporary directory
      ansible.builtin.file:
        path: "{{ kube_prometheus_tmp.path }}"
        state: absent
      when: kube_prometheus_tmp.path is defined

    - name: Get node IP
      ansible.builtin.shell: kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}'
      register: node_ip
      changed_when: false

    - name: Get monitoring services
      ansible.builtin.command: kubectl get svc -n {{ monitoring_namespace }}
      register: monitoring_services
      changed_when: false

    - name: Display monitoring stack status
      ansible.builtin.debug:
        msg: |
          ============================================
          Monitoring stack installed successfully!
          ============================================
          Namespace: {{ monitoring_namespace }}

          📊 Access URLs:
          Grafana:    http://{{ node_ip.stdout }}:{{ grafana_nodeport }}
          Prometheus: http://{{ node_ip.stdout }}:{{ prometheus_nodeport }}

          Note: Grafana has anonymous access enabled (no login required)
          ============================================

          Services:
          {{ monitoring_services.stdout }}
          ============================================
